spring.application.name=attendance-management-system-api
server.port=${PORT:8080}

# ---- MySQL (override with environment variables, see .env.example) ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:attendance_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ---- JPA / Hibernate ----
# "update" creates/updates tables automatically. Use "validate" in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JSON: keep snake_case keys like the original Flask API (roll_no, student_id ...) ----
spring.jackson.property-naming-strategy=SNAKE_CASE
