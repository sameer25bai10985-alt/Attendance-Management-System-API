# Optional: start a MySQL server without installing it.  Run: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: attendance-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: attendance_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
